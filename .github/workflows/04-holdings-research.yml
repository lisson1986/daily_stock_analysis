name: 实盘持仓只读研究（独立验收）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdings-research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: STOCK_LIST
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_CHANNELS: deepseek
      LLM_DEEPSEEK_BASE_URL: https://api.deepseek.com
      LLM_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_DEEPSEEK_MODELS: deepseek-flash
      TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
      BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
      SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 执行两股只读研究
        run: python scripts/run_holdings_research.py
      - name: 上传研究报告（包括失败诊断）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: holdings-research-${{ github.run_number }}
          path: reports/holdings/
          if-no-files-found: warn
          retention-days: 30
