name: Yuexin paper safety tests
on:
  pull_request:
    paths:
      - 'scripts/yuexin_t_paper.py'
      - 'scripts/check_research_coverage.py'
      - 'tests/test_yuexin_t_paper.py'
      - '.github/workflows/yuexin-paper-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML
      - run: python -m unittest discover -s tests -p 'test_yuexin_t_paper.py' -v
      - run: python scripts/check_research_coverage.py
      - name: Ensure no accidental changes to production strategy
        run: |
          git fetch --no-tags --depth=1 origin main\n          git diff --exit-code origin/main HEAD -- config/research-system.yaml .github/workflows/03-research-system.yml src/research/paper.py
